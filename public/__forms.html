<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Netlify Forms Detection</title>
</head>
<body>
    <!-- This file is used by Netlify to detect form fields at build time -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
        <input type="hidden" name="form-name" value="contact" />
        <input type="text" name="bot-field" />
        <input type="text" name="name" />
        <input type="email" name="email" />
        <input type="tel" name="phone" />
        <select name="service">
            <option value="full-planning">Full Wedding Planning</option>
            <option value="partial-planning">Partial Planning</option>
            <option value="coordination">Month-of Coordination</option>
            <option value="concierge">Concierge Services</option>
        </select>
        <input type="text" name="event-date" />
        <input type="text" name="budget" />
        <input type="text" name="occasion" />
        <input type="text" name="referral" />
        <textarea name="details"></textarea>
    </form>

    <!-- /start page ad traffic form -->
    <form name="start" data-netlify="true" netlify-honeypot="bot-field" hidden>
        <input type="hidden" name="form-name" value="start" />
        <input type="text" name="bot-field" />
        <input type="text" name="name" />
        <input type="email" name="email" />
        <input type="text" name="event-date" />
        <input type="text" name="guests" />
        <select name="budget">
            <option value="under-30k">Under $30,000 USD</option>
            <option value="30k-50k">$30,000 – $50,000 USD</option>
            <option value="50k-75k">$50,000 – $75,000 USD</option>
            <option value="75k-100k">$75,000 – $100,000 USD</option>
            <option value="100k-plus">$100,000+ USD</option>
            <option value="not-sure">Not sure yet</option>
        </select>
        <textarea name="vision"></textarea>
    </form>
</body>
</html>
